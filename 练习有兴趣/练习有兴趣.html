    .page {
      max-width: 1240px;
      width: calc(100vw - 12px);
      height: 100vh;
      margin: 0 auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: transparent;
    }
    .header {
      background: linear-gradient(135deg, rgba(79,100,216,.95), rgba(123,140,255,.95));
      color: white;
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 6px 18px rgba(60,75,170,.22);
      border: 2px solid rgba(255,255,255,.45);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tab-btn {
      border: none;
      border-radius: 14px;
      padding: 10px 8px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: .15s;
    }
    .tab-btn:hover { transform: translateY(-1px); }
    .tab-btn.active { color: white; }
    .tab-btn.assertion { background: #dfe7ff; color: #2443a8; }
    .tab-btn.negative { background: #ffe0e0; color: #a51d1d; }
    .tab-btn.questions { background: #dff7ea; color: #167348; }
    .tab-btn.assertion.active { background: #4f64d8; }
    .tab-btn.negative.active { background: #d94848; }
    .tab-btn.questions.active { background: #2f9e69; }

    .tab {
      display: none;
      flex: 1;
      min-height: 0;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.65);
    }
    .tab.active {
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      gap: 8px;
    }
    #assertion { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.55); }
    #negative { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.55); }
    #questions { background: rgba(255,255,255,.34); border-color: rgba(255,255,255,.55); }

    .players, .bank-area, .question-layout {
      background: rgba(255,255,255,.90);
      border-radius: 18px;
      padding: 8px;
      overflow: auto;
      backdrop-filter: blur(2px);
      box-shadow: 0 5px 16px rgba(0,0,0,.10);
    }
    .players {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .player, .q-card {
      background: white;
      border-radius: 16px;
      padding: 9px;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }
    .player-title, .q-title {
      font-size: 25px;
      font-weight: 900;
      text-align: center;
      padding: 7px;
      border-radius: 13px;
    }
    .p1 .player-title, .q1 .q-title { background: #e7f0ff; color: #2443a8; }
    .p2 .player-title, .q2 .q-title { background: #fff0d6; color: #9a6500; }

    .sentence {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.15;
      justify-content: center;
      padding: 7px 4px;
      border-radius: 14px;
      background: #f8f9fa;
      white-space: nowrap;
      overflow: visible;
    }
    .drop-target {
      min-width: 96px;
      height: 38px;
      padding: 2px 6px;
      border-radius: 12px;
      border: 3px dashed #9aa7d9;
      background: white;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #222;
      flex: 0 0 auto;
    }
    .drop-target.active-target {
      outline: 4px solid #ffd43b;
      background: #fff9db;
    }
    #negative .drop-target { border-color: #e59999; }
    #questions .drop-target { border-color: #8fd8b1; }

    .chips-box {
      flex: 1;
      min-height: 90px;
      border-radius: 14px;
      background: #f8f9fa;
      padding: 8px;
      display: flex;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 7px;
      overflow: auto;
    }
    .interest-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #ffffff;
      border: 2px solid #d8def8;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }
    #negative .interest-chip { border-color: #ffd1d1; }
    #questions .interest-chip { border-color: #b7ebcf; }

    .remove {
      border: none;
      background: #e9ecef;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-weight: 900;
      line-height: 1;
    }

    .bank-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      text-align: center;
    }
    .bank {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .word {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,.08);
      transition: .12s;
    }
    .word:hover { transform: scale(1.04); background: #fff9db; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .control {
      border: none;
      border-radius: 13px;
      padding: 10px 8px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: #868e96;
    }
    .p1btn { background: #4f64d8; }
    .p2btn { background: #f0a500; }
    .allbtn { background: #868e96; grid-column: span 2; }

    .question-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 950px) {
      .page { height: auto; }
      .tab.active { grid-template-columns: 1fr; overflow: visible; }
      .players, .question-layout { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: 1fr; }
      .sentence { font-size: 22px; }
      .drop-target { min-width: 100px; height: 38px; font-size: 21px; }
      .word { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="header">
    <h1>表达兴趣</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn assertion active" onclick="openTab(event, 'assertion')">肯定句</button>
    <button class="tab-btn negative" onclick="openTab(event, 'negative')">否定句</button>
    <button class="tab-btn questions" onclick="openTab(event, 'questions')">问句</button>
  </nav>

  <section id="assertion" class="tab active">
    <div class="players">
      <div class="player p1">
        <div class="player-title">学生一</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="a-p1"></span> 感兴趣。</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="a-p1"></span> 有兴趣。</div>
        <div class="chips-box" id="a-p1"></div>
      </div>

      <div class="player p2">
        <div class="player-title">学生二</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="a-p2"></span> 感兴趣。</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="a-p2"></span> 有兴趣。</div>
        <div class="chips-box" id="a-p2"></div>
      </div>
    </div>

    <div class="bank-area">
      <div class="bank-title">词语银行</div>
      <div class="bank wordbank"></div>
      <div class="controls">
        <button class="control p1btn" onclick="clearBox('a-p1')">清空学生一</button>
        <button class="control p2btn" onclick="clearBox('a-p2')">清空学生二</button>
        <button class="control allbtn" onclick="clearTab('assertion')">全部清空</button>
      </div>
    </div>
  </section>

  <section id="negative" class="tab">
    <div class="players">
      <div class="player p1">
        <div class="player-title">学生一</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="n-p1"></span> 不感兴趣。</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="n-p1"></span> 没有兴趣。</div>
        <div class="chips-box" id="n-p1"></div>
      </div>

      <div class="player p2">
        <div class="player-title">学生二</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="n-p2"></span> 不感兴趣。</div>
        <div class="sentence">我 对 <span class="drop-target" data-list="n-p2"></span> 没有兴趣。</div>
        <div class="chips-box" id="n-p2"></div>
      </div>
    </div>

    <div class="bank-area">
      <div class="bank-title">词语银行</div>
      <div class="bank wordbank"></div>
      <div class="controls">
        <button class="control p1btn" onclick="clearBox('n-p1')">清空学生一</button>
        <button class="control p2btn" onclick="clearBox('n-p2')">清空学生二</button>
        <button class="control allbtn" onclick="clearTab('negative')">全部清空</button>
      </div>
    </div>
  </section>

  <section id="questions" class="tab">
    <div class="question-layout">
      <div class="q-card q1">
        <div class="q-title">问学生一</div>
        <div class="sentence">你 对 <span class="drop-target" data-list="q-p1"></span> 感兴趣吗？</div>
        <div class="sentence">你 对 <span class="drop-target" data-list="q-p1"></span> 有兴趣吗？</div>
        <div class="chips-box" id="q-p1"></div>
      </div>

      <div class="q-card q2">
        <div class="q-title">问学生二</div>
        <div class="sentence">你 对 <span class="drop-target" data-list="q-p2"></span> 感兴趣吗？</div>
        <div class="sentence">你 对 <span class="drop-target" data-list="q-p2"></span> 有兴趣吗？</div>
        <div class="chips-box" id="q-p2"></div>
      </div>
    </div>

    <div class="bank-area">
      <div class="bank-title">词语银行</div>
      <div class="bank wordbank"></div>
      <div class="controls">
        <button class="control p1btn" onclick="clearBox('q-p1')">清空学生一</button>
        <button class="control p2btn" onclick="clearBox('q-p2')">清空学生二</button>
        <button class="control allbtn" onclick="clearTab('questions')">全部清空</button>
      </div>
    </div>
  </section>
</div>

<script>
  const words = [
    "汉语", "英语", "阿拉伯语", "音乐", "电影",
    "运动", "篮球", "足球", "游泳", "画画",
    "看书", "历史", "科学", "数学", "电脑",
    "游戏", "做饭", "旅游", "动物", "恐龙",
    "跳舞", "唱歌", "跑步", "骑车", "拍照",
    "漫画", "飞机", "汽车", "太空", "机器人"
  ];

  let activeTarget = null;

  function fillBanks() {
    document.querySelectorAll(".wordbank").forEach(bank => {
      bank.innerHTML = "";
      words.forEach(word => {
        const btn = document.createElement("button");
        btn.className = "word";
        btn.textContent = word;
        btn.onclick = () => addWord(word);
        bank.appendChild(btn);
      });
    });
  }

  function openTab(event, id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
    setDefaultTarget(id);
  }

  function makeChip(word) {
    const chip = document.createElement("span");
    chip.className = "interest-chip";
    chip.innerHTML = `<span>${word}</span><button class="remove" onclick="this.parentElement.remove()">×</button>`;
    return chip;
  }

  function setTarget(target) {
    document.querySelectorAll(".drop-target").forEach(t => t.classList.remove("active-target"));
    activeTarget = target;
    activeTarget.classList.add("active-target");
  }

  function setDefaultTarget(tabId) {
    const first = document.getElementById(tabId).querySelector(".drop-target");
    if (first) setTarget(first);
  }

  document.addEventListener("click", function(e) {
    if (e.target.classList.contains("drop-target")) {
      setTarget(e.target);
    }
  });

  function addWord(word) {
    if (!activeTarget) {
      const currentTab = document.querySelector(".tab.active");
      activeTarget = currentTab.querySelector(".drop-target");
      setTarget(activeTarget);
    }

    const listId = activeTarget.dataset.list;
    const list = document.getElementById(listId);

    list.appendChild(makeChip(word));

    activeTarget.textContent = word;
  }

  function clearBox(id) {
    document.getElementById(id).innerHTML = "";
    document.querySelectorAll(`[data-list="${id}"]`).forEach(target => {
      target.textContent = "";
      target.classList.remove("active-target");
    });
    const currentTab = document.querySelector(".tab.active");
    const first = currentTab.querySelector(".drop-target");
    if (first) setTarget(first);
  }

  function clearTab(tabId) {
    const tab = document.getElementById(tabId);
    tab.querySelectorAll('.chips-box').forEach(box => box.innerHTML = "");
    tab.querySelectorAll('.drop-target').forEach(target => {
      target.textContent = "";
      target.classList.remove("active-target");
    });
    setDefaultTarget(tabId);
  }

  fillBanks();
  setDefaultTarget("assertion");
</script>
</body>
</html>
